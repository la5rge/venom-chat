<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom Chat // Admin</title>
    <style>
        :root {
            --bg-main: #0a0a0a; --bg-sidebar: #121212; --bg-panel: #1a1a1a;
            --bg-message-user: #262626; --accent-red: #e11d48;
            --text-main: #f5f5f5; --text-muted: #a3a3a3; --border-color: #262626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .brand { padding: 24px; font-size: 20px; font-weight: 700; color: var(--text-main); border-bottom: 1px solid var(--border-color); }
        .brand span { color: var(--accent-red); }
        .user-setup { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        .user-setup input { background: var(--bg-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; color: #fff; font-size: 13px; outline: none;}
        .user-setup input:focus { border-color: var(--accent-red); }
        
        .mod-panel { padding: 16px; display: none; background: #1c050a; border: 1px solid rgba(225, 29, 72, 0.3); margin: 16px; border-radius: 6px; }
        .mod-panel h3 { font-size: 12px; color: var(--accent-red); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
        .mod-btn { width: 100%; background: var(--accent-red); border: none; color: white; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .mod-input { width: 100%; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; margin-top: 4px; outline: none; }
        
        .main-chat { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); }
        .chat-header { padding: 20px 32px; background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); }
        .chat-header h2 { font-size: 16px; font-weight: 600; }
        .connection-status { font-size: 12px; color: var(--accent-red); margin-top: 4px; font-weight: 500; }
        .message-container { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        .message { max-width: 60%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; position: relative; }
        .message .meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .message.received { background-color: var(--bg-panel); align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.sent { background-color: var(--bg-message-user); align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.system { background: rgba(225, 29, 72, 0.1); border: 1px dashed var(--accent-red); color: var(--accent-red); max-width: 100%; align-self: center; font-size: 12px; text-align: center; border-radius: 6px; }
        
        .wipe-btn { color: var(--accent-red); font-size: 10px; cursor: pointer; display: none; font-weight: bold; border: 1px solid var(--accent-red); padding: 1px 4px; border-radius: 3px; margin-left: 10px; }
        
        .input-panel { padding: 24px 32px; background-color: var(--bg-sidebar); border-top: 1px solid var(--border-color); display: flex; gap: 16px; width: 100%; }
        .message-input { flex: 1; background-color: var(--bg-main); border: 1px solid var(--border-color); padding: 14px 20px; border-radius: 8px; color: var(--text-main); outline: none; font-size: 14px; }
        .message-input:focus { border-color: var(--accent-red); }
        .send-btn { background-color: var(--accent-red); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">Venom<span>.</span></div>
        <div class="user-setup">
            <label style="font-size: 12px; color: var(--text-muted)">Your Username:</label>
            <input type="text" id="usernameInput" value="User_">
        </div>
        
        <div class="mod-panel" id="modPanel">
            <h3>🛡️ Mod Command Deck</h3>
            <button class="mod-btn" onclick="triggerModAction('clear')">Nuke Chat History</button>
            <button class="mod-btn" onclick="triggerModAction('freeze')">Toggle Global Mute</button>
            
            <h3 style="margin-top: 12px;">👤 Target Overrides</h3>
            <input type="text" id="targetInput" class="mod-input" placeholder="User name here...">
            <button class="mod-btn" onclick="triggerTargetAction('mute')">Mute User</button>
            <button class="mod-btn" onclick="triggerTargetAction('unmute')">Unmute User</button>
            <button class="mod-btn" onclick="triggerTargetAction('ban')">Ban User</button>
        </div>
    </div>
    <div class="main-chat">
        <div class="chat-header">
            <h2>Venom Live Secure Channel</h2>
            <div class="connection-status" id="headerText">● STREAM LIVE AND ONLINE</div>
        </div>
        <div class="message-container" id="box"></div>
        <form class="input-panel" id="chatForm">
            <input type="text" class="message-input" id="in" placeholder="Type your message..." autocomplete="off">
            <button type="submit" class="send-btn" id="btn">Send</button>
        </form>
    </div>

    <script>
        document.getElementById('usernameInput').value += Math.floor(1000 + Math.random() * 9000);
        
        const b = document.getElementById('box'), i = document.getElementById('in'), form = document.getElementById('chatForm');
        const usernameInput = document.getElementById('usernameInput'), modPanel = document.getElementById('modPanel'), targetInput = document.getElementById('targetInput');
        
        const chatChannel = new BroadcastChannel('venom_global_stream');
        
        let globalMuteActive = false;
        let isBanned = false;
        let isMuted = false;

        const ADMIN_NAME = "VenomGod";

        usernameInput.oninput = () => {
            const isOwner = usernameInput.value.trim() === ADMIN_NAME;
            modPanel.style.display = isOwner ? "block" : "none";
            document.querySelectorAll('.wipe-btn').forEach(btn => {
                btn.style.display = isOwner ? "inline-block" : "none";
            });
        };

        chatChannel.onmessage = function(event) {
            const cmd = event.data;
            const currentName = usernameInput.value.trim();
            
            if (cmd.type === 'mod_clear') {
                b.innerHTML = `<div class="message system">[SYSTEM]: Stream history nuked by Administrator.</div>`;
                return;
            }
            if (cmd.type === 'mod_freeze') {
                globalMuteActive = cmd.value;
                appendSystemMessage(globalMuteActive ? "[SYSTEM]: Chat has been frozen by the Moderator." : "[SYSTEM]: Chat un-frozen.");
                return;
            }
            if (cmd.type === 'mod_wipe_line') {
                document.querySelectorAll('.message').forEach(msg => {
                    const txtNode = msg.querySelector('.msg-text');
                    if (txtNode && txtNode.textContent === cmd.textValue) {
                        txtNode.innerHTML = `<span style="font-style:italic; color:var(--text-muted)">[This message was deleted by the Owner]</span>`;
                    }
                });
                return;
            }

            if (cmd.target === currentName) {
                if (cmd.type === 'mod_mute') {
                    isMuted = true;
                    appendSystemMessage("[ALERT]: You have been muted by the Owner.");
                }
                if (cmd.type === 'mod_unmute') {
                    isMuted = false;
                    appendSystemMessage("[ALERT]: Your voice tokens have been restored.");
                }
                if (cmd.type === 'mod_ban') {
                    isBanned = true;
                    b.innerHTML = `<div class="message system">[TERMINATED]: You have been permanently banned from this application.</div>`;
                    form.style.opacity = "0.1";
                    i.disabled = true;
                }
                return;
            }

            if (cmd.sender && cmd.text) {
                appendMessage(cmd.sender, cmd.text, 'received');
            }
        };

        function appendMessage(sender, text, type) {
            const isOwner = usernameInput.value.trim() === ADMIN_NAME;
            const d = document.createElement('div');
            d.className = `message ${type}`;
            
            d.innerHTML = `
                <div class="meta">
                    <span>${sender}</span>
                    <span class="wipe-btn" style="display:${isOwner ? 'inline-block' : 'none'}" onclick="wipeMessageLine(this, '${text.replace(/'/g, "\\'")}')">WIPE</span>
                </div>
                <div class="msg-text">${text}</div>
            `;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }

        function appendSystemMessage(text) {
            const d = document.createElement('div');
            d.className = `message system`;
            d.textContent = text;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }

        function triggerModAction(actionType) {
            if (actionType === 'clear') {
                b.innerHTML = `<div class="message system">[SYSTEM]: Stream history nuked by Administrator.</div>`;
                chatChannel.postMessage({ type: 'mod_clear' });
            }
            if (actionType === 'freeze') {
                globalMuteActive = !globalMuteActive;
                appendSystemMessage(globalMuteActive ? "[LOCAL INFO]: You froze the chat stream." : "[LOCAL INFO]: You unfroze the stream.");
                chatChannel.postMessage({ type: 'mod_freeze', value: globalMuteActive });
            }
        }

        function triggerTargetAction(action) {
            const target = targetInput.value.trim();
            if (!target) return alert("Please enter a username target.");
            
            appendSystemMessage(`[MOD COMMAND]: Issued [${action.toUpperCase()}] targeting ${target}`);
            chatChannel.postMessage({ type: 'mod_' + action, target: target });
            targetInput.value = '';
        }

        function wipeMessageLine(btnElement, textValue) {
            const bubble = btnElement.closest('.message');
            if (bubble) {
                const txtNode = bubble.querySelector('.msg-text');
                if (txtNode) {
                    txtNode.innerHTML = `<span style="font-style:italic; color:var(--text-muted)">[This message was deleted by the Owner]</span>`;
                }
            }
            chatChannel.postMessage({ type: 'mod_wipe_line', textValue: textValue });
        }

        form.onsubmit = function(e) {
            e.preventDefault();
            if (isBanned) return;
            if (isMuted) { alert("You are currently muted by the Owner."); return; }
            
            const text = i.value.trim();
            const sender = usernameInput.value.trim();
            if (!text) return;

            if (globalMuteActive && sender !== ADMIN_NAME) {
                alert("The channel is currently frozen by a moderator.");
                return;
            }

            i.value = '';

            if (text.startsWith('/kick ') && sender === ADMIN_NAME) {
                const targetUser = text.replace('/kick ', '').trim();
                appendSystemMessage(`[MOD COMMAND]: Issued ban directive targeting ${targetUser}`);
                chatChannel.postMessage({ type: 'mod_ban', target: targetUser });
                return;
            }

            appendMessage(sender, text, 'sent');
            chatChannel.postMessage({ sender, text });
        };
    </script>
</body>
</html>
