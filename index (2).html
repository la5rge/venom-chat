<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venom Chat // Admin</title>
    <style>
      :root {
        --bg-main: #0a0a0a;
        --bg-sidebar: #121212;
        --bg-panel: #1a1a1a;
        --bg-message-user: #262626;
        --accent-red: #e11d48;
        --text-main: #f5f5f5;
        --text-muted: #a3a3a3;
        --border-color: #262626;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .sidebar {
        width: 320px;
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
      }
      .brand {
        padding: 24px;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
        border-bottom: 1px solid var(--border-color);
      }
      .brand span {
        color: var(--accent-red);
      }
      .user-setup {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .user-setup input {
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        padding: 8px;
        border-radius: 4px;
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      .user-setup input:focus {
        border-color: var(--accent-red);
      }

      /* Mod Panel UI Elements */
      .mod-panel {
        padding: 16px;
        display: none;
        background: #1c050a;
        border: 1px solid rgba(225, 29, 72, 0.3);
        margin: 16px;
        border-radius: 6px;
      }
      .mod-panel h3 {
        font-size: 12px;
        color: var(--accent-red);
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .mod-btn {
        width: 100%;
        background: var(--accent-red);
        border: none;
        color: white;
        padding: 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 4px;
      }

      .main-chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-main);
      }
      .chat-header {
        padding: 20px 32px;
        background-color: var(--bg-sidebar);
        border-bottom: 1px solid var(--border-color);
      }
      .chat-header h2 {
        font-size: 16px;
        font-weight: 600;
      }
      .connection-status {
        font-size: 12px;
        color: var(--accent-red);
        margin-top: 4px;
        font-weight: 500;
      }
      .message-container {
        flex: 1;
        padding: 32px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Message styling rules */
      .message {
        max-width: 60%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
      }
      .message .meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 4px;
        font-weight: 600;
      }
      .message.received {
        background-color: var(--bg-panel);
        align-self: flex-start;
        border-bottom-left-radius: 2px;
      }
      .message.sent {
        background-color: var(--bg-message-user);
        align-self: flex-end;
        border-bottom-right-radius: 2px;
      }
      .message.system {
        background: rgba(225, 29, 72, 0.1);
        border: 1px dashed var(--accent-red);
        color: var(--accent-red);
        max-width: 100%;
        align-self: center;
        font-size: 12px;
        text-align: center;
        border-radius: 6px;
        white-space: pre-line;
      }

      .input-panel {
        padding: 24px 32px;
        background-color: var(--bg-sidebar);
        border-top: 1px solid var(--border-color);
        display: flex;
        gap: 16px;
        width: 100%;
      }
      .message-input {
        flex: 1;
        background-color: var(--bg-main);
        border: 1px solid var(--border-color);
        padding: 14px 20px;
        border-radius: 8px;
        color: var(--text-main);
        outline: none;
        font-size: 14px;
      }
      .message-input:focus {
        border-color: var(--accent-red);
      }
      .send-btn {
        background-color: var(--accent-red);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="brand">Venom<span>.</span></div>
      <div class="user-setup">
        <label style="font-size: 12px; color: var(--text-muted)"
          >Your Username:</label
        >
        <input type="text" id="usernameInput" value="User_" />
      </div>

      <!-- HIDDEN MOD PANEL -->
      <div class="mod-panel" id="modPanel">
        <h3>🛡️ Mod Command Deck</h3>
        <button class="mod-btn" onclick="triggerModAction('clear')">
          Nuke Chat History
        </button>
        <button class="mod-btn" onclick="triggerModAction('freeze')">
          Toggle Global Mute
        </button>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 12px; line-height: 1.4;">
          Type <span style="color: var(--accent-red);">/help</span> in chat to see all available admin text commands.
        </div>
      </div>
    </div>
    <div class="main-chat">
      <div class="chat-header">
        <h2>Venom Live Secure Channel</h2>
        <div class="connection-status" id="privilegeStatus">● STANDARD USER PRIVILEGES</div>
      </div>
      <div class="message-container" id="box"></div>
      <form class="input-panel" id="chatForm">
        <input
          type="text"
          class="message-input"
          id="in"
          placeholder="Type your message..."
          autocomplete="off"
        />
        <button type="submit" class="send-btn" id="btn">Send</button>
      </form>
    </div>

    <script>
      document.getElementById("usernameInput").value += Math.floor(
        1000 + Math.random() * 9000
      );

      const b = document.getElementById("box"),
        i = document.getElementById("in"),
        form = document.getElementById("chatForm");
      const usernameInput = document.getElementById("usernameInput"),
        modPanel = document.getElementById("modPanel"),
        privilegeStatus = document.getElementById("privilegeStatus");

      const chatChannel = new BroadcastChannel("venom_global_stream");

      let globalMuteActive = false;
      let isBanned = false;

      // CONSTANT: Change this string to your own secret password username!
      const ADMIN_NAME = "VenomGod";

      // Listen for name changes to reveal the secret mod deck
      usernameInput.oninput = () => {
        if (usernameInput.value.trim() === ADMIN_NAME) {
          modPanel.style.display = "block";
          privilegeStatus.textContent = "● OWNER PRIVILEGES ENABLED";
          appendSystemMessage("[SYSTEM]: Access granted. Type /help in the chat box to read the command handbook.");
        } else {
          modPanel.style.display = "none";
          privilegeStatus.textContent = "● STANDARD USER PRIVILEGES";
        }
      };

      chatChannel.onmessage = function (event) {
        const cmd = event.data;

        // Interpret Admin Overrides
        if (cmd.type === "mod_clear") {
          b.innerHTML = `<div class="message system">[SYSTEM]: Stream history nuked by Administrator.</div>`;
          return;
        }
        if (cmd.type === "mod_freeze") {
          globalMuteActive = cmd.value;
          appendSystemMessage(
            globalMuteActive
              ? "[SYSTEM]: Chat has been frozen by the Moderator."
              : "[SYSTEM]: Chat un-frozen."
          );
          return;
        }
        if (
          cmd.type === "mod_kick" &&
          usernameInput.value.trim() === cmd.target
        ) {
          isBanned = true;
          b.innerHTML = `<div class="message system">[TERMINATED]: You have been banned from this stream.</div>`;
          form.style.opacity = "0.2";
          i.disabled = true;
          return;
        }

        // Normal text rendering engine logic
        if (cmd.sender && cmd.text) {
          appendMessage(cmd.sender, cmd.text, "received");
        }
      };

      // Message Outbox Form Submissions 
      form.onsubmit = (e) => {
        e.preventDefault();
        if (isBanned) return;

        const rawText = i.value.trim();
        if (!rawText) return;

        // Custom Help Command (Local display only)
        if (rawText === "/help") {
          if (usernameInput.value.trim() === ADMIN_NAME) {
            appendSystemMessage(
              `⚙️ VENOM ADMIN COMMAND HANDBOOK ⚙️\n` +
              `• /help - Displays this administration handbook.\n` +
              `• /kick [username] - Terminates connection and permanently bans targeted user's tab.\n` +
              `• /clear - Clears chat log elements for all connected tabs globally.\n` +
              `• /freeze - Toggles global mute state across all tabs.`
            );
          } else {
            appendSystemMessage("[SYSTEM]: /help command can only be executed by verified system administrators.");
          }
          i.value = "";
          return;
        }

        // Handle text commands if sender is verified admin
        if (usernameInput.value.trim() === ADMIN_NAME) {
          if (rawText.startsWith("/kick ")) {
            const targetUser = rawText.replace("/kick ", "").trim();
            chatChannel.postMessage({ type: "mod_kick", target: targetUser });
            appendSystemMessage(`[MOD COMMAND SENT]: Kicked user "${targetUser}"`);
            i.value = "";
            return;
          }
          if (rawText === "/clear") {
            triggerModAction("clear");
            i.value = "";
            return;
          }
          if (rawText === "/freeze") {
            triggerModAction("freeze");
            i.value = "";
            return;
          }
        }

        // Enforce global mute for standard users
        if (globalMuteActive && usernameInput.value.trim() !== ADMIN_NAME) {
          appendSystemMessage("[SYSTEM]: Chat is currently frozen. You cannot speak.");
          i.value = "";
          return;
        }

        const username = usernameInput.value.trim() || "Anonymous";

        // Broadcast to other tabs/windows
        chatChannel.postMessage({ sender: username, text: rawText });

        // Add to current UI layout
        appendMessage(username, rawText, "sent");
        i.value = "";
      };

      // UI Layout Helpers
      function appendMessage(sender, text, type) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${type}`;

        const metaDiv = document.createElement("div");
        metaDiv.className = "meta";
        metaDiv.textContent = sender;

        const textSpan = document.createElement("span");
        textSpan.textContent = text;

        msgDiv.appendChild(metaDiv);
        msgDiv.appendChild(textSpan);
        b.appendChild(msgDiv);
        
        // Auto Scroll Engine
        b.scrollTop = b.scrollHeight;
      }

      function appendSystemMessage(text) {
        const sysDiv = document.createElement("div");
        sysDiv.className = "message system";
        sysDiv.textContent = text;
        b.appendChild(sysDiv);
        b.scrollTop = b.scrollHeight;
      }

      // Mod UI Button Controls
      function triggerModAction(actionType) {
        if (usernameInput.value.trim() !== ADMIN_NAME) return;

        if (actionType === "clear") {
          b.innerHTML = `<div class="message system">[SYSTEM]: Stream history nuked by Administrator.</div>`;
          chatChannel.postMessage({ type: "mod_clear" });
        } else if (actionType === "freeze") {
          globalMuteActive = !globalMuteActive;
          appendSystemMessage(
            globalMuteActive
              ? "[SYSTEM]: Chat has been frozen by the Moderator."
              : "[SYSTEM]: Chat un-frozen."
          );
          chatChannel.postMessage({ type: "mod_freeze", value: globalMuteActive });
        }
      }
    </script>
  </body>
</html>
